# Sagt Cloudflare, wie aus dem gebauten Ordner "dist" eine Webseite wird.
# Cloudflare führt beim Deploy "npx wrangler deploy" aus und liest diese Datei.
#
# Es gibt hier absichtlich keinen Programm-Code (kein "main"): Die App ist eine
# reine Browser-Anwendung. Cloudflare liefert die Dateien aus "dist" direkt aus.

name = "kurbisverlust"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
# Client-seitiges Routing: Ruft jemand /dashboard direkt auf oder lädt die Seite
# neu, gibt es keine Datei dieses Namens. Statt eines 404 kommt index.html, und
# die App zeigt drinnen die richtige Seite an. Das übernimmt Cloudflare hier
# direkt — eine eigene _redirects-Datei ist weder nötig noch erlaubt (sie
# würde als Endlosschleife abgelehnt).
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------
# Zwei Webseiten aus demselben Code (Runde Q)
# ---------------------------------------------------------------------
# Der echte Betrieb und die Beispiel-Oberflaeche sind zwei getrennte
# Aufbauten: zwei Supabase-Projekte, zwei Cloudflare-Projekte, zwei Builds.
# Zwei Builds sind unvermeidlich, weil VITE_SUPABASE_URL und
# VITE_SUPABASE_ANON_KEY beim Bauen fest in die Seite kommen.
#
# Ohne das hier wuerden beide auf denselben Worker "kurbisverlust"
# deployen — der zweite ueberschriebe den ersten, und die Halle zeigte
# ploetzlich Beispieldaten. Die benannte Umgebung gibt der zweiten Seite
# einen eigenen Worker:
#
#   npx wrangler deploy                    -> kurbisverlust           (echt)
#   npx wrangler deploy --env beispiel     -> kurbisverlust-beispiel  (Beispiel)
#
# Der Standardbefehl bleibt unveraendert; eine bestehende Veroeffentlichung
# muss nichts umstellen.
[env.beispiel]
name = "kurbisverlust-beispiel"

# Ausdruecklich wiederholt statt geerbt: Welche Schluessel eine benannte
# Umgebung erbt, haengt an der Wrangler-Fassung. Hier steht es doppelt und
# gilt damit in jeder.
[env.beispiel.assets]
directory = "./dist"
not_found_handling = "single-page-application"
