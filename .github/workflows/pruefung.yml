name: Prüfung

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: App bauen und testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  datenbank:
    name: Schema, Logik und RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - run: ./supabase/test/run.sh 'postgresql://postgres:postgres@localhost:5432/postgres'
